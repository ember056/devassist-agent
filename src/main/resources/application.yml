server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md,markdown,log,pdf

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置。
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      chat:
        options:
          # DashScope 对话请求超时时间，单位毫秒。
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
    # MCP 客户端默认关闭。需要接入外部 MCP 工具时，通过环境变量显式开启。
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: ${TENCENT_MCP_URL:https://mcp-api.tencent-cloud.com}
              sse-endpoint: ${TENCENT_MCP_SSE_ENDPOINT:/sse/your-endpoint}

# DashScope API 与 embedding 配置。
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}
  embedding:
    model: text-embedding-v4
    query-cache:
      enabled: true
      max-size: 10000
      ttl-seconds: 1800

# 文档分片配置。
document:
  parse:
    pdf:
      # If extracted text is too sparse, treat the PDF as scanned and route it
      # to an external OCR parser such as MinerU in a later integration.
      min-page-text-length: 80
  chunk:
    max-size: 800
    overlap: 100

# RAG 配置。
rag:
  top-k: 3
  model: "qwen3-max"
  query-rewrite:
    enabled: true
    on-demand-enabled: true
    min-trigger-length: 24
    min-similarity: 0.8
  rerank:
    enabled: true
    min-query-length: 12
    close-score-delta: 0.2
  bm25:
    bootstrap-enabled: true
  retrieval:
    simple-mode: HYBRID
    complex-mode: HYBRID
    complex-min-length: 18
    candidate-multiplier: 3
    vector-weight: 0.65
    bm25-weight: 0.35
    cache:
      enabled: true
      max-size: 2000
      ttl-seconds: 300
  faithfulness:
    enabled: true
    verifier-agent-enabled: true
    min-coverage: 0.2
  chat-verification:
    enabled: true
    top-k: 3

# 聊天记忆配置。
chat:
  memory:
    redis-enabled: true
    key-prefix: onecall:session
    max-pairs: 6
    ttl-hours: 168
    semantic-enabled: true
    semantic-top-k: 3
    semantic-max-answer-length: 1200

# Prometheus 配置。
prometheus:
  base-url: http://localhost:9090
  timeout: 10
  mock-enabled: false

# 云日志服务配置。
cls:
  mock-enabled: false

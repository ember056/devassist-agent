server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md,markdown,log,pdf

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

agent:
  trace:
    enabled: true
    persist-enabled: true
    storage-dir: ./data/traces

aiops:
  task:
    persist-enabled: true
    storage-dir: ./data/aiops-tasks

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      chat:
        options:
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: ${TENCENT_MCP_URL:https://mcp-api.tencent-cloud.com}
              sse-endpoint: ${TENCENT_MCP_SSE_ENDPOINT:/sse/your-endpoint}

dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}
  embedding:
    model: text-embedding-v4
    query-cache:
      enabled: true
      max-size: 10000
      ttl-seconds: 1800

document:
  parse:
    pdf:
      min-page-text-length: 80
  chunk:
    max-size: 800
    overlap: 100

rag:
  top-k: 3
  model: "qwen3-max"
  query-rewrite:
    enabled: true
    on-demand-enabled: true
    min-trigger-length: 24
    min-similarity: 0.8
  rerank:
    enabled: true
    min-query-length: 12
    close-score-delta: 0.2
  bm25:
    bootstrap-enabled: true
  retrieval:
    simple-mode: HYBRID
    complex-mode: HYBRID
    complex-min-length: 18
    candidate-multiplier: 3
    vector-weight: 0.65
    bm25-weight: 0.35
    cache:
      enabled: true
      max-size: 2000
      ttl-seconds: 300
  agentic-retrieval:
    enabled: true
    max-subqueries: 4
    subquery-top-k: 6
    skip-when-primary-runbook-hit: true
  faithfulness:
    enabled: true
    verifier-agent-enabled: true
    min-coverage: 0.2
  chat-verification:
    enabled: true
    top-k: 3

benchmark:
  judge:
    enabled: false
    model: ${DASHSCOPE_JUDGE_MODEL:qwen-plus}
    temperature: 0.0
    timeout-ms: ${DASHSCOPE_JUDGE_TIMEOUT_MS:60000}
    pass-threshold: 4.0
    max-cases-per-run: 30

chat:
  memory:
    redis-enabled: true
    key-prefix: onecall:session
    max-pairs: 6
    ttl-hours: 168
    semantic-enabled: true
    semantic-top-k: 3
    semantic-max-answer-length: 1200

prometheus:
  base-url: http://localhost:9090
  timeout: 10
  mock-enabled: false

cls:
  mock-enabled: false

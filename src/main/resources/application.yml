server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 默认关闭；如需接入外部 MCP 服务，请通过环境变量显式开启并配置 endpoint
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: ${TENCENT_MCP_URL:https://mcp-api.tencent-cloud.com}
              sse-endpoint: ${TENCENT_MCP_SSE_ENDPOINT:/sse/your-endpoint}

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值（用于自定义配置）
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3-max"  # 大语言模型名称
  query-rewrite:
    enabled: true
    min-similarity: 0.8  # 改写前后 query 的余弦相似度低于该值时回退原 query
  rerank:
    enabled: true
    min-query-length: 12  # query 较长时触发轻量 rerank
    close-score-delta: 0.2  # top 结果分数接近时触发 rerank
  bm25:
    bootstrap-enabled: true  # 启动时从 uploads 目录加载轻量 BM25 索引
  retrieval:
    simple-mode: HYBRID  # 简单问题可选 VECTOR / BM25 / HYBRID
    complex-mode: HYBRID # 复杂问题先混合召回候选，再触发 rerank
    complex-min-length: 18
    candidate-multiplier: 3
    vector-weight: 0.65
    bm25-weight: 0.35
  faithfulness:
    enabled: true
    verifier-agent-enabled: true  # 优先使用 VerifierAgent 校验答案忠实度，失败时回退本地规则
    min-coverage: 0.2  # 答案关键词被参考资料覆盖的最低比例
  chat-verification:
    enabled: true  # 普通聊天中，文档/排障类问题回答后触发 RAG sources 后置校验
    top-k: 3

# Chat Memory 配置
chat:
  memory:
    redis-enabled: true
    key-prefix: onecall:session
    max-pairs: 6
    ttl-hours: 168  # 7 天
    semantic-enabled: true  # 是否启用 Milvus 会话语义长期记忆
    semantic-top-k: 3
    semantic-max-answer-length: 1200

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: false  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）
